name: workers
on:
  push:
    branches: [main]
    paths: ["workers/**", ".github/workflows/workers.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [easyocr, tfid]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: workers/${{ matrix.worker }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yassine-64/docparse-${{ matrix.worker }}:latest
            ghcr.io/yassine-64/docparse-${{ matrix.worker }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.worker }}
          cache-to: type=gha,mode=max,scope=${{ matrix.worker }}
