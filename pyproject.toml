[project]
name = "docparse"
version = "0.1.0"
description = "Document ingestion engine: PDF/Office → structured blocks with page + bbox provenance, OCR routing, quality gate, RAG chunks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yassine Mazhare" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdfium2>=4.30",
    "pdfplumber>=0.11",
    "pillow>=10",
    "httpx>=0.27",
    "typer>=0.12",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
tesseract = ["pytesseract>=0.3.10"]
mistral = ["mistralai>=1.5"]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
all = ["docparse[api,tesseract,mistral,openai,anthropic]"]

[project.scripts]
docparse = "docparse.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "reportlab>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "types-openpyxl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docparse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["workers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"src/docparse/interfaces/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
exclude = ["workers", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs external binaries or network"]

[tool.coverage.run]
source = ["docparse"]
